[project]
name = "thisnotthat"
version = "2.0.0"
description = "Interactive visualization and labeling embedded into a Jupyter/Marimo notebook."
authors = [
    { name = "Benoit Hamelin", email = "benoit.hamelin@cyber.gc.ca" }
]
requires-python = ">=3.10"
dependencies = [
    "anywidget[dev]>=0.9.18",
    "glasbey>=0.3.0",
    "ipywidgets>=8.1.6",
    "jupyter-scatter>=0.22.0",
    "quak>=0.3.3",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flake8>=7.2.0",
    "jupyterlab",
    "marimo>=0.13.8",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "python-lsp-server>=1.12.2",
    "ruff>=0.11.9",
]

[tool.hatch.build.targets.sdist]
include = [
    "thisnotthat/*.py",
    "thisnotthat/*.js",
    "thisnotthat/*.css",
]
